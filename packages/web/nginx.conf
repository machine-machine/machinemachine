server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Pitch page: serve /pitch/index.html for all /pitch/* routes
    location ~ ^/pitch {
        try_files /pitch/index.html =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache HTML — browsers always revalidate, get fresh content after deploys
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Cache static assets (Astro hashes filenames — safe to cache forever)
    location /_assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
